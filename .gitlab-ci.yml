stages:
  - test

pytest:
  stage: test
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - pytest
  artifacts:
    when: always
    reports:
      junit: pytest-results.xml
    paths:
      - pytest-results.xml
  only:
    - main
